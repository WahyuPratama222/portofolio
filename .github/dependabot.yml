version: 2
updates:
  # Project dependencies (reads package.json and bun.lock)
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Bundle minor and patch bumps into one PR to avoid PR spam
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Keep the actions used in workflows up to date (checkout, setup-bun, etc.)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
